name: Generate Kitfile

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: kitfile-generator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nathan-young1/kitfile-generator-action@main